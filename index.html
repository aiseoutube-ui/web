      /* SCRAMBLE ANIMATIONS */
      .scramble-char {
          display: inline-block;
          color: #ffffff;
          font-weight: bold;
          text-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff, 0 0 40px rgba(255, 255, 255, 0.7);
          animation: panic-flicker 0.1s infinite;
      }
      .scramble-char.red-glitch {
          color: transparent;
          -webkit-text-stroke: 1px #E20000;
          text-stroke: 1px #E20000;
          font-weight: 500;
          text-shadow: 0 0 8px rgba(255, 0, 0, 0.6), 0 0 12px rgba(255, 0, 0, 0.4);
          animation: none;
      }
      @keyframes panic-flicker {
          0% { opacity: 1; filter: brightness(1.5); }
          50% { opacity: 0.6; filter: brightness(1); }
          100% { opacity: 1; filter: brightness(1.5); }
      }
      .is-glitching {
          animation: shake-hard 0.2s infinite;
      }
      @keyframes shake-hard {
          0%, 100% { transform: translate(0, 0); } 10% { transform: translate(-1px, -1px); }
          20% { transform: translate(1px, 1px); } 30% { transform: translate(-1px, 1px); }

          60% { transform: translate(1px, 0); } 70% { transform: translate(0, 1px); }

    <script>
        class TextScramble {
            constructor(el, glitchAudioEl) {
                this.el = el;
                this.glitchEl = glitchAudioEl;
                this.chars = '█▓▒░▀▄▌▐ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
                this.update = this.update.bind(this);
            }
            setText(newText) {
                const oldText = this.el.innerText;
                const length = Math.max(oldText.length, newText.length);
                const promise = new Promise((resolve) => this.resolve = resolve);
                this.queue = [];
                this.glitchPlayCount = 0;
                this.maxGlitches = Math.floor(Math.random() * 3);
                for (let i = 0; i < length; i++) {
                    const from = oldText[i] || '';
                    const to = newText[i] || '';
                    const start = Math.floor(Math.random() * 40);
                    const end = start + Math.floor(Math.random() * 60) + 60;
                    this.queue.push({ from, to, start, end, char: from });
                }
                cancelAnimationFrame(this.frameRequest);
                this.frame = 0;
                this.update();
                return promise;
            }
            update() {
                let output = '';
                let complete = 0;
                for (let i = 0, n = this.queue.length; i < n; i++) {
                    let { from, to, start, end, char } = this.queue[i];
                    let charClass = '';
                    if (this.frame >= end) {
                        complete++;
                        output += to;
                    } else if (this.frame >= start) {
                        if (Math.random() < 0.2) char = this.chars[Math.floor(Math.random() * this.chars.length)];
                        if (this.glitchEl && Math.random() < 0.05) charClass = ' red-glitch';
                        
                        output += `<span class="scramble-char${charClass}">${char}</span>`;
                        this.queue[i].char = char;
                    } else {
                        output += from;
                    }
                }
                this.el.innerHTML = output;
                if (complete === this.queue.length) {
                    this.resolve();
                } else {
                    this.frameRequest = requestAnimationFrame(this.update);
                    this.frame++;
                }
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            const preloaderEl = document.getElementById('scramble-preloader');
            const rootEl = document.getElementById('root');
            const urlParams = new URLSearchParams(window.location.search);
            const skipIntro = urlParams.get('skipIntro') === 'true';
            
            // Force reset hasSeenIntro for testing if needed
            // localStorage.removeItem('hasSeenIntro');

            if (skipIntro || localStorage.getItem('hasSeenIntro') === 'true') {
                preloaderEl.style.display = 'none';
                rootEl.style.opacity = '1';
                rootEl.style.visibility = 'visible';
                document.body.classList.remove('preloader-active');
                setTimeout(() => { window.dispatchEvent(new CustomEvent('preloaderFinished')); }, 100);
            } else {
                const bgAudioEl = document.getElementById('bg-audio');
                const loopAudioEl = document.getElementById('loop-audio');
                const glitchAudioEl = document.getElementById('glitch-audio');
                const transitionAudioEl = document.getElementById('transition-audio');
                window.isAudioReady = false;

                const unlockAudio = () => {
                    if (window.isAudioReady) return;
                    // Mobile Safari requires user interaction to play audio
                    bgAudioEl.volume = 0.5;
                    bgAudioEl.play().catch(e => console.log("Audio autoplay blocked"));
                    window.isAudioReady = true;
                };
                
                const startMainAppTransition = () => {
                    if(window.isAudioReady) {
                      transitionAudioEl.currentTime = 0;
                      transitionAudioEl.volume = 0.8;
                      transitionAudioEl.play().catch(e => {});
                      gsap.to([bgAudioEl, loopAudioEl], { volume: 0, duration: 1.5, onComplete: () => {
                          bgAudioEl.pause();
                          loopAudioEl.pause();
                      }});
                    }
                    const tl = gsap.timeline({
                      onComplete: () => {
                        preloaderEl.style.display = 'none';
                        document.body.classList.remove('preloader-active');
                        try { localStorage.setItem('hasSeenIntro', 'true'); } catch (e) { console.error(e); }
                        window.dispatchEvent(new CustomEvent('preloaderFinished'));
                      }
                    });
                    tl.to(preloaderEl, { opacity: 0, duration: 1.5, ease: 'power2.inOut' })
                      .to(rootEl, { opacity: 1, visibility: 'visible', duration: 1.5, ease: 'power3.out' }, '-=0.8');
                };

                const runIntroSequence = () => {
                    const textElement = document.getElementById('target-text');
                    const percentageElement = document.querySelector('.percentage-counter');
                    const fx = new TextScramble(textElement, glitchAudioEl);
                    const phrases = ['DE LA VISIÓN', 'CON ADAPTACIÓN', 'INTELIGENCIA', 'SIN LÍMITES'];
                    const subliminalText = "THE LAST ART"; 
                    const phraseTimings = [1, 6, 11, 16]; 
                    const subliminalTimings = [3.5, 8.5, 13.5];
                    let progress = { value: 0 };
                    
                    // Show elements
                    gsap.to('.hero-container', { opacity: 1, duration: 1 });
                    gsap.to('.percentage-counter', { opacity: 1, duration: 1 });

                    const masterTl = gsap.timeline({ onComplete: startMainAppTransition });

                    const triggerSubliminal = () => {
                         const currentContent = textElement.innerHTML;
                         // FAST GLITCH REPLACEMENT
                         textElement.innerHTML = `<span class="flash-glitch">${subliminalText}</span>`;
                         
                         setTimeout(() => {
                             textElement.innerHTML = currentContent;
                         }, 100); 
                    };

                    masterTl.to(progress, {
                        value: 100, duration: 20, ease: 'none',
                        onUpdate: () => {
                            if (Math.random() > 0.15) percentageElement.innerText = `${Math.floor(progress.value)}%`;
                            else percentageElement.innerText = `${Math.floor(Math.random() * 100)}%`;
                        }
                    }, 0);

                    phrases.forEach((phrase, index) => {
                        masterTl.call(() => {
                            textElement.classList.add('is-glitching');
                            fx.setText(phrase).then(() => {
                                textElement.classList.remove('is-glitching');
                            });
                        }, [], phraseTimings[index]);
                    });

                    subliminalTimings.forEach((time) => {
                        masterTl.call(triggerSubliminal, [], time);
                    });
                };

                // START ORB LOGIC
                const startOrbEl = document.getElementById('start-orb');
                
                // Position in center initially
                gsap.set(startOrbEl, { 
                    left: '50%', top: '50%', xPercent: -50, yPercent: -50, 
                    opacity: 1, scale: 1 
                });

                // Breathing animation
                const pulseAnim = gsap.to(startOrbEl, { 
                    scale: 1.15, duration: 2, ease: 'sine.inOut', repeat: -1, yoyo: true 
                });

                startOrbEl.addEventListener('click', () => {
                    unlockAudio();
                    pulseAnim.kill();
                    
                    const tl = gsap.timeline();
                    tl.to(startOrbEl, {
                        scale: 50, opacity: 0, duration: 1.5, ease: 'power2.in',
                        onComplete: () => startOrbEl.style.display = 'none'
                    })
                    .call(runIntroSequence, [], "-=0.5");
                }, { once: true });
            }
        });
    </script>
